services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyflow
      POSTGRES_PASSWORD: moneyflow
      POSTGRES_DB: moneyflow_dev
    ports:
      - '5431:5432'
    volumes:
      - moneyflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneyflow -d moneyflow_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  moneyflow_pgdata:
